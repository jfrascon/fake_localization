/**/fake_localization:
  ros__parameters:
    use_sim_time: $(var use_sim_time)
    global_frame: map
    odometry_frame: $(var robot_prefix)odom
    base_frame: $(var robot_prefix)base_footprint_link
    delta_x: 0.0
    delta_y: 0.0
    delta_yaw: 0.0
    # Time tolerance added to the TF timestamp.
    transform_tolerance: 0.1
